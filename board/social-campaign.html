case'confirm':confirmIntelSubtopics(slug,{focusEdit:true});break;case'note-confirm':confirmIntelSubtopics(slug);break;case'edit':startIntelEdit(slug);break;case'note-edit':startIntelEdit(slug,{jump:true});break;case'add-own':startIntelEdit(slug,{add:true});break;case'add':addIntelRow(slug);break;case'remove':removeIntelRow(slug,Number(arg));break;case'cancel-edit':cancelIntelEdit(slug);break;case'bank':openIntelBank(slug,arg);break;}});app.addEventListener('keydown',event=>{const field=event.target;if(event.isComposing||event.altKey||event.ctrlKey||event.metaKey)return;const tab=field.closest?.('[data-intel-act="tab"]');if(tab){const ids=INTEL_TABS.map(item=>item.id);const at=ids.indexOf(tab.dataset.intelArg);const next=event.key==='ArrowRight'?(at+1)%ids.length:event.key==='ArrowLeft'?(at+ids.length-1)%ids.length:event.key==='Home'?0:event.key==='End'?ids.length-1:-1;const slug=tab.closest('[data-intel-brand]')?.dataset.intelBrand;if(next<0||at<0||!slug)return;event.preventDefault();setIntelTab(slug,ids[next]);return;}
if(field instanceof HTMLInputElement&&field.dataset.intelRow!==undefined&&event.key==='Escape'){const slug=field.closest('[data-intel-brand]')?.dataset.intelBrand;if(slug){event.preventDefault();cancelIntelEdit(slug);}}});app.addEventListener('input',event=>{const field=event.target;if(!(field instanceof HTMLInputElement)||field.dataset.intelRow===undefined)return;const slug=field.closest('[data-intel-brand]')?.dataset.intelBrand;const state=slug?intelStates.get(slug):null;const row=state?.rows[Number(field.dataset.intelRow)];if(!row)return;row.name=field.value;state.error='';const form=field.closest('form');const{issue,text}=intelEditStatus(state.rows);const line=form?.querySelector('.intel-count');if(line){line.textContent=text;line.classList.toggle('is-bad',Boolean(issue));}
const save=form?.querySelector('button[type="submit"]');if(save&&!state.busy)save.disabled=Boolean(issue);form?.querySelector('.inline-error')?.remove();});app.addEventListener('submit',event=>{const form=event.target;if(!(form instanceof HTMLFormElement)||form.dataset.intelForm===undefined)return;event.preventDefault();const slug=form.closest('[data-intel-brand]')?.dataset.intelBrand;if(slug)void submitSubtopics(slug,intelState(slug).rows,{focusEdit:true});});app.addEventListener('error',event=>{const image=event.target;if(!(image instanceof HTMLImageElement)||!image.closest('.intel-thumb'))return;intelBadPictures.add(image.getAttribute('src'));image.remove();},true);addEventListener('hashchange',()=>{drawer=null;viewer=null;connectorsView=false;render();});addEventListener('beforeunload',event=>{if(![...jobUi.values()].some(ui=>hasUnsentReviewChanges(ui.review)))return;event.preventDefault();event.returnValue='';});void refresh();}

</script>
</body>
