<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#071A3A" />
    <title>Social Campaign</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <span class="logo-tile" aria-label="3echo">
        <img src="/assets/logo-reversed.png" alt="3echo" width="44" height="22" />
      </span>
      <span class="topbar-divider" aria-hidden="true"></span>
      <h1>Social Campaign</h1>
      <span class="status" id="connection" data-state="connecting">Connecting</span>
      <span class="status status-chat" id="chat-activity" data-state="idle">Chat idle</span>
      <span class="status status-busy" id="busy-pill" data-busy="false" hidden>Working</span>
      <span class="busy-bar" id="busy-bar" aria-hidden="true" data-busy="false"></span>
    </header>
    <main id="root" class="root" aria-live="polite">
      <section class="card">
        <h2>Loading</h2>
        <p class="muted">Opening Social Campaign.</p>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
